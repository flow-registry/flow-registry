<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow 沙箱 · AssistBox</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
#sandbox { display:flex; flex-direction:column; gap:10px; max-width:720px; margin:24px auto; padding:0 16px; }
#sandbox select,#sandbox input,#sandbox textarea,#sandbox button { background:#14161c; border:1px solid #2a2f3a; border-radius:10px; color:#e7e9ee; padding:9px 12px; font-size:13px; }
#sandbox textarea { min-height:60px; font-family:ui-monospace,monospace; resize:vertical; }
#out { white-space:pre-wrap; font-family:ui-monospace,monospace; font-size:12px; color:#9be29b; background:#0d0f14; border:1px solid #2a2f3a; border-radius:10px; padding:12px; min-height:60px; max-height:260px; overflow-y:auto; }
.cell { background:rgba(0,0,0,.24); border:1px solid rgba(255,255,255,.16); border-radius:22px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
.cell .sum { font-size:13px; color:#fff; }
.cell .extra { font-size:12px; color:rgba(255,255,255,.5); }
.cell .st { font-size:11px; color:#7dd3fc; }
.cell .banner { font-size:13px; }
.cell .bar { height:4px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
.cell .bar > div { height:100%; background:#7dd3fc; }
.cell .cellbtn { display:inline-block; font-size:12px; color:#7dd3fc; border:1px solid rgba(125,211,252,.3); border-radius:8px; padding:4px 10px; }
.note { font-size:11px; color:rgba(255,255,255,.4); }
.kvlabel { font-size:11px; color:rgba(255,255,255,.5); }
</style></head>
<body>
<div id="sandbox">
  <h2>Flow 沙箱<span class="note">（浏览器模拟 ct — 同步 ABI，预览近似真机）</span></h2>
  <div>
    <label class="kvlabel">Flow</label>
    <select id="flow" style="width:100%"></select>
  </div>
  <div>
    <label class="kvlabel">跑到第几步（含）</label>
    <select id="entry" style="width:100%"></select>
  </div>
  <div>
    <label class="kvlabel">KV 种子（每行 key=value，给 storage.kv 用）</label>
    <textarea id="kvseed" placeholder="proxy.subscription.url=https://…" spellcheck="false"></textarea>
  </div>
  <button id="run">运行步 + 渲染 cell</button>
  <div id="viewcell"></div>
  <div id="out">…</div>
  <div class="note">限制：net.fetch 走同步 XHR（CORS 仍然生效）；storage.kv/storage.n 是同一块内存 KV；signal 只记录不投递；时间/定时器不模拟。</div>
</div>
<script src="sandbox.js"></script>
</body></html>
