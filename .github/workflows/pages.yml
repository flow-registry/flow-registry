name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build .flow packages
        run: |
          mkdir -p dist
          for dir in flows/*/; do
            id=$(basename "$dir")
            (cd "$dir" && zip -qr "$OLDPWD/dist/$id.flow" .)
          done
          node .github/scripts/build-dist-index.mjs
          ls -l dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - uses: actions/deploy-pages@v4
        id: deployment
